[[integrations]]
name = "snooty-cache-plugin"

[build]
publish = "dist"
command = ". ./scripts/netlify-install.sh && . ./build.sh $REPO_NAME $PARSER_VERSION"

[build.environment]
ORG_NAME = "10gen"
REPO_NAME = "cloud-docs"
BRANCH_NAME = "main"
SITE_NAME = "atlas"
PARSER_VERSION = "v0.20.18"
# Netlify's automatic "Install dependencies" step runs `npm install` before our
# `command` above ever executes, with no way to inject CodeArtifact auth ahead of
# it. --dry-run makes that automatic step a no-op; scripts/netlify-install.sh does
# the real, authenticated install as the first part of `command` instead.
NPM_FLAGS = "--dry-run"
