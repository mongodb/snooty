name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v1
        with:
          node-version: '18.15'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.NPM_AWS_KEY }}
          aws-secret-access-key: ${{ secrets.NPM_AWS_SECRET }}
          aws-region: us-east-1
      - name: Authenticate with CodeArtifact
        run: |
          CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token \
            --domain mongodb --domain-owner 271346171620 --region us-east-1 \
            --query authorizationToken --output text)
          echo "::add-mask::$CODEARTIFACT_TOKEN"
          echo "NPM_AWS_AUTH=$CODEARTIFACT_TOKEN" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint && npm run format
      - name: Test
        run: npm test
        env:
          CI: true
